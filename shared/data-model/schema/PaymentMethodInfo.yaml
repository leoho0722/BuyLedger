types:
  - name: PaymentMethodInfo
    kind: entity
    doc: 付款方式與無卡、銀行匯款、貨到付款三個旗標，避免只憑名稱判斷類型
    traits: [value-equality, hashable, serializable]
    fields:
      - name: name
        type: string
        doc: 付款方式名稱，也是主檔識別值
      - name: isCardless
        type: bool
        doc: 是否為無卡付款
      - name: isBankTransfer
        type: bool
        doc: 是否為銀行匯款
      - name: isCashOnDelivery
        type: bool
        doc: 是否為貨到付款
