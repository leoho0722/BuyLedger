types:
  - name: LedgerOrder
    kind: entity
    doc: 訂單資料
    traits: [value-equality, serializable, identity]
    fields:
      - name: id
        type: string
        doc: 訂單編號
      - name: customer
        type: LedgerCustomer
        doc: 客戶資料
      - name: status
        type: OrderStatus
        doc: 訂單目前狀態
      - name: currency
        type: CurrencyCode
        doc: 商品幣別
      - name: date
        type: date
        doc: 訂單日期
      - name: items
        type: array<LedgerOrderItem>
        doc: 商品項目
      - name: itemCost
        type: decimal
        doc: 商品成本 (TWD)
      - name: domesticShipping
        type: decimal
        doc: 國內運費成本 (TWD)
      - name: internationalShipping
        type: decimal
        doc: 國際運費成本 (TWD)
      - name: foreignDomesticShipping
        type: decimal
        doc: 商品來源國的國內運費成本 (TWD)
      - name: cardFeeRate
        type: decimal
        doc: 刷卡手續費比例
      - name: platformFeeRate
        type: decimal
        doc: 平台手續費比例
      - name: paymentFeeRate
        type: decimal
        doc: 金流手續費比例
      - name: chargedAmount
        type: decimal
        doc: 向客戶收取的金額 (TWD)
      - name: cardlessDeductionAmount
        type: decimal
        doc: 無卡付款的折抵金額 (TWD)
      - name: cardlessSupplementAmount
        type: decimal
        doc: 無卡付款的補款金額 (TWD)
      - name: orderSource
        type: string
        doc: 訂單來源
      - name: categories
        type: array<string>
        doc: 商品類別
      - name: paymentMethod
        type: string
        doc: 付款方式
      - name: notes
        type: string
        doc: 訂單備註；沒有備註時為空字串
      - name: reconciliationStatus
        type: string
        doc: 對帳狀態；不需對帳時為空字串
      - name: campaignNames
        type: array<string>
        doc: 所屬開團名稱；空陣列表示散單
      - name: paymentReceiptStatus
        type: PaymentReceiptStatus
        doc: 收款狀態
      - name: isCashOnDelivery
        type: bool
        doc: 是否為貨到付款
      - name: photos
        type: array<data>
        doc: 訂單照片；沒有照片時為空陣列
      - name: mergedSourceIDs
        type: array<string>
        doc: 合併前的訂單編號；非合併訂單為空陣列
