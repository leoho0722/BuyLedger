types:
  - name: LedgerOrder
    kind: entity
    doc: 用於列表、詳情與彙總的訂單資料。
    traits: [value-equality, serializable, identity]
    fields:
      - name: id
        type: string
        doc: 訂單編號。
      - name: customer
        type: LedgerCustomer
        doc: 訂單客戶。
      - name: status
        type: OrderStatus
        doc: 訂單目前狀態。
      - name: currency
        type: CurrencyCode
        doc: 商品原始幣別。
      - name: date
        type: date
        doc: 訂單建立或更新日期。
      - name: items
        type: array<LedgerOrderItem>
        doc: 訂單商品項目。
      - name: itemCost
        type: decimal
        doc: 商品折合新台幣後的成本。
      - name: domesticShipping
        type: decimal
        doc: 國內運費成本。
      - name: internationalShipping
        type: decimal
        doc: 國際運費成本。
      - name: foreignDomesticShipping
        type: decimal
        doc: 商品來源國當地的「國內運費」成本 (折合 TWD)。例如賣家把商品從來源國國內出貨到集運倉的運送費。
      - name: cardFeeRate
        type: decimal
        doc: 刷卡手續費比例。
      - name: platformFeeRate
        type: decimal
        doc: 平台手續費比例。
      - name: paymentFeeRate
        type: decimal
        doc: 金流手續費比例 (0–1，例如 0.005 = 0.5%)；用於信用卡之外的第三方金流抽成。
      - name: chargedAmount
        type: decimal
        doc: 實際向客戶收款的新台幣金額。
      - name: cardlessDeductionAmount
        type: decimal
        doc: |-
          無卡折抵金額 (TWD)。

          用於「無卡」類付款方式紀錄客戶以儲值金、購物金等方式折抵的金額；折抵會從收益中扣除。非無卡訂單一律以 0 帶入。
      - name: cardlessSupplementAmount
        type: decimal
        doc: |-
          無卡補款金額 (TWD)。

          用於「無卡」類付款方式紀錄客戶以轉帳等方式補繳的金額；補款會加到收益中。非無卡訂單一律以 0 帶入。
      - name: orderSource
        type: string
        doc: 訂單來源。
      - name: categories
        type: array<string>
        doc: |-
          商品類別 (至少一個)。

          多個類別僅會由「合併訂單」產生 (聯集兩筆來源訂單的類別)；一般訂單編輯維持單選、儲存為單元素陣列。
      - name: paymentMethod
        type: string
        doc: 付款方式。
      - name: notes
        type: string
        doc: 訂單備註；選填，無備註時為空字串。
      - name: reconciliationStatus
        type: string
        doc: |-
          對帳狀態。

          僅在付款方式屬於無卡或銀行匯款 (款項不會即時入帳、需事後人工對帳) 時有意義；其他付款方式一律以空字串帶入。其值對應一份可自訂的對帳狀態清單。
      - name: campaignNames
        type: array<string>
        doc: |-
          歸屬的開團名稱清單。

          沿用 orderSource 的字串名稱引用模式；空陣列代表未歸屬任何開團 (散單)。多個開團僅會由「合併訂單」產生。開團改名時統一 cascade 更新所有相符訂單 (陣列內逐元素取代)。
      - name: paymentReceiptStatus
        type: PaymentReceiptStatus
        doc: |-
          收款狀態 (待收款／已收款)。

          作為開團分貨清單與結團結算判定「已收款」的唯一來源；對所有付款方式皆有意義，預設為待收款 (pending)。
      - name: isCashOnDelivery
        type: bool
        doc: |-
          此訂單是否以「貨到付款」類付款方式成立。

          於儲存時依選到的付款方式之貨到付款旗標快照寫入 (與無卡欄位同樣為 data-driven，收益計算只依本型別欄位、不需另外查付款方式主檔)。為 true 時，因收款金額已含預估的三種運費，收益計算會額外扣除 domesticShipping + internationalShipping + foreignDomesticShipping；非貨到付款一律為 false。
      - name: photos
        type: array<data>
        doc: |-
          訂單照片 (已正規化的 JPEG 位元組)。

          每張照片於匯入時經降採樣與重編碼後存入；張數有上限，由編輯流程守門。無照片時為空陣列。
      - name: mergedSourceIDs
        type: array<string>
        doc: |-
          合併來源訂單編號。

          由「合併訂單」產生的新訂單記錄兩筆來源訂單的 id，作為統計歸屬 (採合併前收益) 與鏈式合併判定的依據；非合併產生的訂單一律為空陣列 (即「葉端訂單」)。
