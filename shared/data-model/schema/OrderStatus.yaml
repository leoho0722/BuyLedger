types:
  - name: OrderStatus
    kind: enum
    doc: 訂單目前狀態
    traits: [case-iterable, serializable, identity]
    cases:
      - name: quoting
        doc: 正在報價
      - name: confirmed
        doc: 客戶已確認
      - name: purchased
        doc: 已完成下單
      - name: shipping
        doc: 運送中
      - name: partiallyArrived
        doc: 部分到貨
      - name: arrived
        doc: 已到貨但未交付客戶
      - name: delivered
        doc: 已交付客戶
      - name: pickedUp
        doc: 客戶已取貨
      - name: cancelled
        doc: 已取消
      - name: merged
        doc: 已合併到其他訂單
