types:
  - name: LedgerOrderItem
    kind: entity
    doc: 訂單中的商品項目
    traits: [value-equality, identity]
    serialization: custom
    fields:
      - name: id
        type: uuid
        doc: 商品項目的穩定識別值
        default: $newUUID
      - name: name
        type: string
        doc: 商品名稱
        mutable: true
      - name: quantity
        type: int
        doc: 商品數量
        mutable: true
      - name: unitPrice
        type: decimal
        doc: 商品單價
        mutable: true
