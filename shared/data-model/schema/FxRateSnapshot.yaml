types:
  - name: FxRateSnapshot
    kind: entity
    doc: 某個時間點的匯率快照
    traits: [value-equality]
    fields:
      - name: date
        type: date
        doc: 匯率時間
      - name: base
        type: CurrencyCode
        doc: 計算匯率的基準幣別
      - name: rates
        type: map<CurrencyCode, decimal>
        doc: 各目標幣別的匯率，表示 1 單位基準幣別可換多少目標幣別
