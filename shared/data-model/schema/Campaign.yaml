types:
  - name: Campaign
    kind: entity
    doc: 一次團購批次，包含開團、結單與結團狀態（CI 漂移驗證）
    traits: [value-equality, serializable, identity]
    fields:
      - name: id
        type: string
        doc: 開團的穩定識別值 (UUID 字串)
      - name: name
        type: string
        doc: 開團名稱，也是訂單歸屬的依據
        mutable: true
      - name: openDate
        type: date
        doc: 開團日期
        mutable: true
      - name: closeDate
        type: date
        doc: 結單日期；未設定表示持續收單
        mutable: true
        nullable: true
      - name: status
        type: CampaignStatus
        doc: 開團目前狀態
        mutable: true
      - name: settledDate
        type: date
        doc: 結團日期；未設定表示尚未結團
        mutable: true
        nullable: true
      - name: notes
        type: string
        doc: 開團備註；沒有備註時為空字串
        mutable: true
