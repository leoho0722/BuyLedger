types:
  - name: CampaignStatus
    kind: enum
    doc: |-
      開團在收單流程中的狀態。

      僅兩態：收單中與收單結束。「結團」是另外記錄結團日期 (settledDate) 的完成動作，不是狀態，因此不在此列。
    traits: [case-iterable, serializable, identity]
    cases:
      - name: ongoing
        doc: 開團中，仍在收單。
      - name: closed
        doc: 已收單，停止收單、進入後續處理。
